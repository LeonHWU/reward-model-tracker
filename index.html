<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reward Model 训练学习路径</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div>
          <p class="label">Process Reward Model</p>
          <h1>Reward Model 训练学习路径</h1>
          <p class="intro">
            面向已掌握 Transformer 原理、目标做 Process Reward Model 的学习清单。
          </p>
          <p class="links">
            关联：repo <span>convergence-ai/prm</span> · benchmark
            <span>WebRewardBench</span> · 论文 <span>Web-Shepherd</span>
          </p>
        </div>
        <section class="progress-summary" aria-label="总体进度">
          <div class="progress-number" id="overall-progress">0%</div>
          <div class="progress-caption">总体进度</div>
          <div class="progress-track">
            <span id="overall-progress-bar"></span>
          </div>
        </section>
      </header>

      <section class="section">
        <h2>优先级总览</h2>
        <div class="priority-table" id="priority-list"></div>
      </section>

      <section class="section">
        <h2>学习清单</h2>
        <div class="tracker-header">
          <span>阶段</span>
          <span>需要完成</span>
          <span>优先级</span>
          <span>进度</span>
          <span>状态</span>
        </div>
        <div id="task-list"></div>
      </section>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
