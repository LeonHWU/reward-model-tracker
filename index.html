<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reward Model Study Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div>
          <p class="label">Reward Model Study</p>
          <h1>Learning checklist</h1>
          <p class="intro">
            Clear list of what to learn for real reward model training, plus a
            simple progress tracker.
          </p>
        </div>
        <section class="progress-summary" aria-label="Overall progress">
          <div class="progress-number" id="overall-progress">0%</div>
          <div class="progress-track">
            <span id="overall-progress-bar"></span>
          </div>
        </section>
      </header>

      <section class="tracker">
        <div class="tracker-header">
          <span>Topic</span>
          <span>Why it matters</span>
          <span>Progress</span>
          <span>Status</span>
        </div>
        <div id="topic-list"></div>
      </section>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
